<!DOCTYPE html>
<!-- 
  ============================================================
  前端页面结构 + UI 样式：成员A
  后端交互层（JS 事件绑定、DOM渲染）：成员B
  后端逻辑层（数据CRUD、业务算法、数据验证）：成员C
  ============================================================
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👗 我的衣柜 - 电子衣橱</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="nav-bar">
    <div class="nav-inner">
      <h1 class="nav-logo">🎀 我的电子衣橱</h1>
      <div class="nav-links">
        <a href="index.html" class="nav-link">首页</a>
        <a href="wardrobe.html" class="nav-link active">👗 衣柜</a>
        <a href="dress-up.html" class="nav-link">✨ 换装</a>
        <a href="collection.html" class="nav-link">💖 收藏</a>
      </div>
    </div>
  </nav>

  <!-- 主内容 -->
  <main class="container">
    <section class="page-header">
      <h2>👗 我的衣柜</h2>
      <p>管理你的所有衣物，数据保存在本地浏览器中。</p>
    </section>

    <!-- 衣物表单 - 新增 / 编辑 -->
    <section class="section-card" id="form-section">
      <h3 id="form-title">✏️ 新增衣物</h3>
      <form id="clothes-form" class="clothes-form">
        <input type="hidden" id="edit-id" value="">
        <div class="form-group">
          <label for="clothes-name">衣物名称</label>
          <input type="text" id="clothes-name" placeholder="如：蓝色冲锋衣" required>
        </div>
        <div class="form-group">
          <label for="clothes-type">衣物类型</label>
          <select id="clothes-type" required>
            <option value="">请选择</option>
            <option value="top">上衣</option>
            <option value="outer">外套</option>
            <option value="bottom">裤子</option>
          </select>
        </div>
        <div class="form-group">
          <label for="clothes-thickness">厚度等级</label>
          <select id="clothes-thickness" required>
            <option value="">请选择</option>
            <option value="1">薄 (1)</option>
            <option value="2">中等 (2)</option>
            <option value="3">厚 (3)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="clothes-material">材质</label>
          <select id="clothes-material">
            <option value="cotton">棉质</option>
            <option value="wool">羊毛</option>
            <option value="polyester">聚酯纤维</option>
            <option value="denim">牛仔</option>
            <option value="fleece">抓绒</option>
            <option value="nylon">尼龙</option>
            <option value="silk">丝绸</option>
            <option value="linen">亚麻</option>
          </select>
        </div>
        <div class="form-group">
          <label for="clothes-style">款式</label>
          <select id="clothes-style">
            <option value="tshirt">T恤</option>
            <option value="hoodie">卫衣/毛衣</option>
            <option value="jacket">夹克</option>
            <option value="coat">外套/大衣</option>
            <option value="jeans">长裤</option>
            <option value="shorts">短裤</option>
          </select>
        </div>
        <div class="form-group">
          <label for="clothes-sleeve">袖长</label>
          <select id="clothes-sleeve">
            <option value="short">短袖</option>
            <option value="long">长袖</option>
            <option value="none">无袖</option>
          </select>
        </div>
        <div class="form-group">
          <label for="clothes-color">颜色名称</label>
          <input type="text" id="clothes-color" placeholder="如：蓝色">
        </div>
        <div class="form-group">
          <label for="clothes-colorhex">颜色色值</label>
          <input type="color" id="clothes-colorhex" value="#CCCCCC">
        </div>
        <div class="form-group">
          <label>衣物素材</label>
          <div id="preset-clothes-list" class="preset-list">
            <!-- 预设样衣由JS动态渲染 -->
          </div>
          <input type="hidden" id="clothes-img" value="">
        </div>

        <!-- 拍照上传（自动卡通化） -->
        <div class="form-group photo-upload-group">
          <label>📸 拍照 / 上传（自动卡通化）</label>
          <div class="photo-upload-area">
            <div class="photo-upload-buttons">
              <button type="button" class="btn btn-secondary" id="open-camera-btn">📷 拍照</button>
              <button type="button" class="btn btn-secondary" id="upload-photo-btn">🖼️ 上传图片</button>
            </div>
            <input type="file" id="photo-file-input" accept="image/*" style="display:none">
            <video id="camera-preview" style="display:none" autoplay playsinline></video>
            <div id="photo-preview-area" class="photo-preview-area" style="display:none">
              <div class="photo-preview-container">
                <canvas id="photo-preview-canvas"></canvas>
                <div class="photo-preview-actions">
                  <button type="button" class="btn btn-primary" id="confirm-cartoon-btn">✅ 确认使用</button>
                  <button type="button" class="btn btn-secondary" id="cancel-photo-btn">❌ 取消</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">保存衣物</button>
          <button type="button" class="btn btn-secondary" id="cancel-edit" style="display:none">取消编辑</button>
        </div>
      </form>
    </section>

    <!-- 衣柜卡片展示 -->
    <section class="section-card" id="wardrobe-section">
      <h3>📋 我的衣物列表</h3>
      <div id="wardrobe-list" class="card-container">
        <!-- JS动态渲染 -->
      </div>
      <p id="empty-wardrobe" class="empty-hint">衣柜空空如也，快来添加衣物吧～</p>
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <p>🎀 电子衣橱 · 比赛Demo版本</p>
  </footer>

  <!-- 加载顺序：数据层 → 逻辑层 → 交互层 -->
  <script src="js/storage.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/cartoonizer.js"></script>
  <script src="js/wardrobe.js"></script>
</body>
</html>
